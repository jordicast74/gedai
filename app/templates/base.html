<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GEDAI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-shell" aria-label="Navegacion principal">
            <a class="brand" href="{{ url_for('navegacion.inicio') }}">
                <span class="brand-mark">G</span>
                <span>GEDAI</span>
            </a>
            <div class="nav-links">
                {% for endpoint, label in nav_items %}
                    <a
                        href="{{ url_for(endpoint) }}"
                        class="{% if endpoint == active_endpoint %}active{% endif %}"
                    >
                        {{ label }}
                    </a>
                {% endfor %}
            </div>
        </nav>
    </header>

    <main class="page-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="messages" aria-live="polite">
                    {% for category, message in messages %}
                        <p class="message {{ category }}">{{ message }}</p>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
